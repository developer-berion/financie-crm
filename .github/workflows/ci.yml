name: CRM Quality Gate

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - master

jobs:
  quality-check:
    name: Type Check & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Smoke Test (Type Check)
        run: npm run test:smoke
