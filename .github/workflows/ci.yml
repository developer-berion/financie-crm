name: CRM Quality Gate

on:
  push:
    branches:
      - staging
      - codex-version
  pull_request:
    branches:
      - master

jobs:
  quality-check:
    name: Secrets, Smoke, Unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret & Governance Scan
        run: npm run scan:secrets

      - name: Lint (informational)
        continue-on-error: true
        run: npm run lint

      - name: Run Smoke Test (Type Check)
        run: npm run test:smoke

      - name: Run Unit Tests
        run: npm run test -- --run
